[package]
name = "clean-arch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
directories = "5.0.1"
env_logger = "0.11.5"
jfs = "0.9.0"
log = "0.4.22"
thiserror = "2"

[dev-dependencies]
rstest = "0.23.0"
tempfile = "3.13.0"

[dependencies.serde]
version = "1.0.210"
features = ["derive"]

[dependencies.clap]
version = "4.5.19"
features = ["derive"]

[dependencies.uuid]
version = "1.10.0"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
    "serde",             # Enable Serilize and Deserialize derive
]
